[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatreel"
version = "0.1.0"
description = "Auto highlight reels synced to a beat."
requires-python = ">=3.11"
dependencies = [
  "librosa>=0.10.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "click>=8.1",
  "tqdm>=4.66",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "yt-dlp>=2024.5.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]
scene = [
  "scenedetect[opencv]>=0.6.4",
]
# SOTA beat / downbeat tracker. Madmom's PyPI release breaks on Python 3.11+
# due to NumPy deprecations; the main-branch git ref has the fixes but pins
# numpy<2.0 transitively. Install in a dedicated venv if your main env runs
# numpy 2.x — the default beatreel install works fine without this extra
# (beats.detect_beats falls back to the librosa path automatically).
accurate = [
  "madmom @ git+https://github.com/CPJKU/madmom@main",
  "numpy<2.0",
  "cython>=0.29",
]

[project.scripts]
beatreel = "beatreel.cli:main"

[tool.setuptools.packages.find]
include = ["beatreel*"]
